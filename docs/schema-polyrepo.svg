<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1226"/>
      <stop offset="1" stop-color="#1a1140"/>
    </linearGradient>
    <linearGradient id="fab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="reg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>

  <!-- Title -->
  <text x="48" y="58" fill="#fff" font-size="30" font-weight="700">RA-drop-maker — la fabrique à drops</text>
  <text x="48" y="86" fill="#a5b4fc" font-size="16">Le cœur se publie une fois · chaque drop le référence (jamais ne le copie)</text>

  <!-- ============ FABRIQUE ============ -->
  <g filter="url(#sh)">
    <rect x="48" y="120" width="520" height="610" rx="22" fill="url(#fab)" opacity="0.16"/>
    <rect x="48" y="120" width="520" height="610" rx="22" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  </g>
  <text x="72" y="158" fill="#ddd6fe" font-size="15" letter-spacing="2">🏭 CE REPO — LA FABRIQUE</text>
  <text x="72" y="186" fill="#fff" font-size="22" font-weight="700">RA-drop-maker</text>

  <!-- core -->
  <g filter="url(#sh)">
    <rect x="72" y="208" width="472" height="150" rx="14" fill="url(#fab)"/>
  </g>
  <text x="92" y="238" fill="#fff" font-size="17" font-weight="700">📦 packages/@thomyiy/*  ·  LE CŒUR mutualisé</text>
  <g font-size="13.5" fill="#ede9fe">
    <rect x="92" y="252" width="120" height="30" rx="8" fill="#ffffff22"/><text x="104" y="272">config</text>
    <rect x="222" y="252" width="120" height="30" rx="8" fill="#ffffff22"/><text x="234" y="272">themes</text>
    <rect x="352" y="252" width="80" height="30" rx="8" fill="#ffffff22"/><text x="364" y="272">ui</text>
    <rect x="92" y="290" width="120" height="30" rx="8" fill="#ffffff22"/><text x="104" y="310">core</text>
    <rect x="222" y="290" width="210" height="30" rx="8" fill="#ffffff22"/><text x="234" y="310">commerce</text>
  </g>
  <text x="92" y="345" fill="#ddd6fe" font-size="12.5">private:true · publishConfig.access = "restricted" 🔒</text>

  <!-- templates -->
  <g filter="url(#sh)"><rect x="72" y="378" width="230" height="120" rx="14" fill="#ffffff14" stroke="#a78bfa" stroke-width="1"/></g>
  <text x="90" y="406" fill="#fff" font-size="15" font-weight="700">📁 templates/drop/</text>
  <text x="90" y="430" fill="#c7d2fe" font-size="13">squelette d'un</text>
  <text x="90" y="450" fill="#c7d2fe" font-size="13">repo de drop</text>
  <text x="90" y="478" fill="#c7d2fe" font-size="13">+ .npmrc privé</text>

  <!-- playbook -->
  <g filter="url(#sh)"><rect x="314" y="378" width="230" height="120" rx="14" fill="#ffffff14" stroke="#a78bfa" stroke-width="1"/></g>
  <text x="332" y="406" fill="#fff" font-size="15" font-weight="700">📚 playbook/</text>
  <text x="332" y="430" fill="#c7d2fe" font-size="13">docs lancement :</text>
  <text x="332" y="450" fill="#c7d2fe" font-size="13">roadmap · marketing</text>
  <text x="332" y="470" fill="#c7d2fe" font-size="13">légal · checklists</text>

  <!-- wizard -->
  <g filter="url(#sh)"><rect x="72" y="516" width="472" height="60" rx="14" fill="#312e81" stroke="#818cf8" stroke-width="1"/></g>
  <text x="92" y="552" fill="#fff" font-size="16" font-weight="700">🤖  /new-drop  +  pnpm new-drop  — le wizard qui scaffolde</text>

  <!-- dogfood -->
  <g filter="url(#sh)"><rect x="72" y="592" width="472" height="58" rx="14" fill="#ffffff10" stroke="#a78bfa" stroke-width="1" stroke-dasharray="5 4"/></g>
  <text x="92" y="618" fill="#fff" font-size="15" font-weight="700">🧪 apps/jewel-memories</text>
  <text x="92" y="638" fill="#c7d2fe" font-size="12.5">drop de dogfood — workspace:* (symlink local, non publié)</text>

  <text x="92" y="690" fill="#ddd6fe" font-size="13">Règle d'or : on ne forke jamais le cœur.</text>
  <text x="92" y="710" fill="#ddd6fe" font-size="13">Ce qui change par drop = thème · contenu · flow d'achat.</text>

  <!-- ============ REGISTRE ============ -->
  <g filter="url(#sh)">
    <rect x="650" y="200" width="300" height="190" rx="20" fill="url(#reg)" opacity="0.18"/>
    <rect x="650" y="200" width="300" height="190" rx="20" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="674" y="236" fill="#bae6fd" font-size="14" letter-spacing="1.5">🌐 REGISTRE PRIVÉ</text>
  <text x="674" y="266" fill="#fff" font-size="19" font-weight="700">GitHub Packages</text>
  <text x="674" y="296" fill="#e0f2fe" font-size="14">@thomyiy/*  publiés</text>
  <text x="674" y="320" fill="#e0f2fe" font-size="14">versions figées (^0.1.0)</text>
  <g><rect x="674" y="338" width="252" height="34" rx="9" fill="#0c4a6e"/>
  <text x="688" y="360" fill="#bae6fd" font-size="13">🔐 restricted · exige token read:packages</text></g>

  <!-- ============ DROPS ============ -->
  <g filter="url(#sh)">
    <rect x="650" y="470" width="560" height="125" rx="18" fill="url(#drop)" opacity="0.16"/>
    <rect x="650" y="470" width="560" height="125" rx="18" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <text x="674" y="502" fill="#fde68a" font-size="14" letter-spacing="1.5">🪐 REPO DU DROP A — séparé</text>
  <g font-size="13" fill="#fff7ed">
    <rect x="674" y="514" width="170" height="30" rx="8" fill="#ffffff22"/><text x="686" y="534">drop.config.ts (contenu)</text>
    <rect x="854" y="514" width="160" height="30" rx="8" fill="#ffffff22"/><text x="866" y="534">thème (design)</text>
    <rect x="674" y="552" width="170" height="30" rx="8" fill="#ffffff22"/><text x="686" y="572">flow d'achat</text>
    <rect x="854" y="552" width="160" height="30" rx="8" fill="#ffffff22"/><text x="866" y="572">project/ (docs)</text>
  </g>
  <text x="1030" y="535" fill="#fde68a" font-size="12.5">⤷ que le</text>
  <text x="1030" y="552" fill="#fde68a" font-size="12.5">spécifique</text>
  <text x="1030" y="569" fill="#fde68a" font-size="12.5">marque</text>

  <g filter="url(#sh)">
    <rect x="650" y="620" width="560" height="60" rx="18" fill="url(#drop)" opacity="0.10"/>
    <rect x="650" y="620" width="560" height="60" rx="18" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6 5"/>
  </g>
  <text x="674" y="656" fill="#fde68a" font-size="14" font-weight="700">🪐 REPO DU DROP B …  (même cœur, autre thème/config)</text>

  <!-- Railway -->
  <g filter="url(#sh)"><rect x="1052" y="200" width="158" height="80" rx="16" fill="#111827" stroke="#6b7280" stroke-width="1.2"/></g>
  <text x="1131" y="234" fill="#fff" font-size="22" text-anchor="middle">🚀</text>
  <text x="1131" y="262" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Railway</text>

  <!-- ===== ARROWS ===== -->
  <!-- 1. release: core -> registry -->
  <path d="M544 283 C600 283, 600 290, 648 290" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="556" y="276" fill="#34d399" font-size="13" font-weight="700">① pnpm release</text>

  <!-- 2. wizard -> drop (scaffold) -->
  <path d="M544 546 C610 546, 600 520, 648 516" fill="none" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="556" y="540" fill="#e5e7eb" font-size="13" font-weight="700">② /new-drop (copie template + seed playbook)</text>

  <!-- 3. registry -> drop (install / reference) -->
  <path d="M800 392 C800 430, 800 440, 800 466" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="812" y="438" fill="#7dd3fc" font-size="13" font-weight="700">③ pnpm install — RÉFÉRENCE</text>
  <text x="812" y="456" fill="#7dd3fc" font-size="11.5">(téléchargé dans node_modules, pas committé)</text>

  <!-- 4. drop -> railway -->
  <path d="M1131 470 C1131 400, 1131 330, 1131 282" fill="none" stroke="#e5e7eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1142" y="400" fill="#e5e7eb" font-size="13" font-weight="700">④ build</text>
  <text x="1142" y="418" fill="#9ca3af" font-size="11.5">(GITHUB_TOKEN requis)</text>

  <!-- legend reference vs copy -->
  <g>
    <rect x="650" y="700" width="560" height="56" rx="12" fill="#ffffff0d" stroke="#374151" stroke-width="1"/>
    <circle cx="672" cy="722" r="6" fill="#38bdf8"/>
    <text x="686" y="727" fill="#cbd5e1" font-size="13"><tspan font-weight="700">Référence</tspan> = ligne "@thomyiy/ui":"^0.1.0" → résolu depuis le registre privé.</text>
    <text x="686" y="746" fill="#cbd5e1" font-size="13">Le code du cœur n'est jamais dupliqué dans le repo du drop.</text>
  </g>
</svg>
